buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.6.1 required by Mediastream SDK transitive deps (IMA + PrivacySandbox)
        classpath("com.android.tools.build:gradle:8.6.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // NPAW Youbora Analytics (transitive dep of Mediastream SDK)
        maven { url 'https://npaw.jfrog.io/artifactory/youbora/' }
        maven { url 'https://artifact.plugin.npaw.com/artifactory/plugins/android' }
    }
}
